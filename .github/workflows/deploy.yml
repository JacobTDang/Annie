name: deploy

# Manual-only — auto-deploy on main push is too risky for a hackathon
# codebase. Trigger from the Actions tab when ready.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which app to deploy"
        required: true
        default: "both"
        type: choice
        options: [backend, frontend, both]

jobs:
  backend:
    if: ${{ inputs.target == 'backend' || inputs.target == 'both' }}
    name: Deploy backend to Fly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  frontend:
    if: ${{ inputs.target == 'frontend' || inputs.target == 'both' }}
    name: Deploy frontend to Fly
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config frontend/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
