# nginx config for the dockerized frontend.
# - Serves the built SPA from /usr/share/nginx/html
# - Proxies backend routes to the `backend` service on the compose network

upstream lumen_backend {
    # Configurable backend host — the Dockerfile entrypoint substitutes
    # ${BACKEND_HOST}:${BACKEND_PORT} via envsubst before nginx starts.
    # Defaults (set in the Dockerfile entrypoint):
    #   BACKEND_HOST=backend   (docker-compose local stack)
    #   BACKEND_PORT=5000
    # Fly.io override: BACKEND_HOST=lumen-api.internal
    server ${BACKEND_HOST}:${BACKEND_PORT};
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — anything not a real file routes to index.html so client-
    # side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache-busted hashed assets — long max-age, immutable.
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpe?g|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Backend proxy routes ─────────────────────────────────────────────
    location /api/  { proxy_pass http://lumen_backend; include /etc/nginx/proxy_params.conf; }
    location /media/ { proxy_pass http://lumen_backend; include /etc/nginx/proxy_params.conf; }
    location /status/ { proxy_pass http://lumen_backend; include /etc/nginx/proxy_params.conf; }
    location = /ask  { proxy_pass http://lumen_backend; include /etc/nginx/proxy_params.conf; }
    location = /render { proxy_pass http://lumen_backend; include /etc/nginx/proxy_params.conf; }
    location = /health { proxy_pass http://lumen_backend; include /etc/nginx/proxy_params.conf; }
    location = /openapi.json { proxy_pass http://lumen_backend; include /etc/nginx/proxy_params.conf; }
    location = /topics { proxy_pass http://lumen_backend; include /etc/nginx/proxy_params.conf; }
    location = /breakdown { proxy_pass http://lumen_backend; include /etc/nginx/proxy_params.conf; }
}
